name: Build Switch NRO

on:
  push:
    branches: [main]
    paths:
      - "switch/**"
      - "Songs/**"
      - "fonts/Manrope/**"
      - ".github/workflows/build-switch.yml"
  pull_request:
    paths:
      - "switch/**"
      - "Songs/**"
      - "fonts/Manrope/**"
      - ".github/workflows/build-switch.yml"
  workflow_dispatch:

jobs:
  nova-home:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 audio and font libraries
        run: dkp-pacman -S --needed --noconfirm switch-sdl2_mixer switch-sdl2_ttf
      - name: Build NovaHome.nro
        run: make -C switch/NovaHome
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NovaHome-nro
          path: switch/NovaHome/NovaHome.nro
          if-no-files-found: error
