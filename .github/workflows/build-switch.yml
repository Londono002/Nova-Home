name: Build Switch NRO

on:
  push:
    branches: [main]
    paths:
      - "switch/**"
      - ".github/workflows/build-switch.yml"
  pull_request:
    paths:
      - "switch/**"
      - ".github/workflows/build-switch.yml"
  workflow_dispatch:

jobs:
  nova-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NovaHome.nro
        run: docker run --rm -v "$GITHUB_WORKSPACE:/data" devkitpro/devkita64:latest bash -lc "dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_gfx switch-sdl2_image && make -C /data/switch/NovaHome"
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NovaHome-nro
          path: switch/NovaHome/NovaHome.nro
          if-no-files-found: error
